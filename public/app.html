<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLSIE — Sri Lanka Sports Intelligence Ecosystem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="bi bi-trophy-fill"></i></div>
      <div>
        <div class="logo-title">SLSIE</div>
        <div class="logo-sub">Sports Intelligence</div>
      </div>
    </div>

    <div class="sidebar-section-label">MAIN MENU</div>
    <ul class="sidebar-nav">
      <li><a href="#/dashboard"    class="nav-link" data-view="dashboard">
        <i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
      <li><a href="#/federations"  class="nav-link" data-view="federations">
        <i class="bi bi-building"></i><span>Federations</span>
        <span class="nav-badge" id="badge-feds">34</span></a></li>
      <li><a href="#/governance"   class="nav-link" data-view="governance">
        <i class="bi bi-bar-chart-steps"></i><span>Governance Benchmark</span></a></li>
      <li><a href="#/athletes"     class="nav-link" data-view="athletes">
        <i class="bi bi-people-fill"></i><span>Athletes</span></a></li>
      <li><a href="#/fitforlife"   class="nav-link" data-view="fitforlife">
        <i class="bi bi-heart-pulse-fill"></i><span>Fit for Life</span></a></li>
      <li><a href="#/reports"      class="nav-link" data-view="reports">
        <i class="bi bi-file-earmark-bar-graph"></i><span>Reports</span></a></li>
    </ul>

    <div class="sidebar-section-label mt-3">SYSTEM</div>
    <ul class="sidebar-nav">
      <li><a href="#/settings" class="nav-link" data-view="settings">
        <i class="bi bi-gear"></i><span>Settings</span></a></li>
    </ul>

    <div class="sidebar-footer">
      <div class="user-avatar" id="sidebarInitials">NA</div>
      <div class="user-info">
        <div class="user-name" id="sidebarName">Loading…</div>
        <div class="user-role" id="sidebarRole">—</div>
      </div>
      <a href="#" id="logoutBtn" class="logout-btn" title="Sign out">
        <i class="bi bi-box-arrow-right"></i>
      </a>
    </div>
  </nav>

  <!-- MAIN AREA -->
  <div id="mainArea">
    <!-- TOP BAR -->
    <div id="topBar">
      <div class="topbar-left">
        <button class="sidebar-toggle d-md-none" id="sidebarToggle">
          <i class="bi bi-list"></i>
        </button>
        <nav aria-label="breadcrumb" class="ms-2">
          <ol class="breadcrumb mb-0" id="breadcrumb">
            <li class="breadcrumb-item active">Dashboard</li>
          </ol>
        </nav>
      </div>
      <div class="topbar-right">
        <span class="topbar-badge"><i class="bi bi-circle-fill text-success me-1" style="font-size:.5rem"></i>Live</span>
        <span class="topbar-date" id="topbarDate"></span>
        <div class="topbar-avatar" id="topbarInitials">NA</div>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="content">
      <div class="d-flex justify-content-center align-items-center" style="height:60vh">
        <div class="text-center text-muted">
          <div class="spinner-border text-primary mb-3"></div>
          <div>Loading dashboard…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- OVERLAY for mobile -->
  <div id="overlay" class="sidebar-overlay d-none"></div>

  <!-- DATA ENTRY MODAL -->
  <div id="modalOverlay" class="modal-overlay d-none" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-title" id="modalTitle"></span>
        <button type="button" class="modal-close" onclick="closeModal()"><i class="bi bi-x-lg"></i></button>
      </div>
      <form id="modalForm" novalidate>
        <div class="modal-body-scroll" id="modalBody"></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-action" id="modalSubmitBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
